services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: xionico-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" >/dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: xionico-db-init
    entrypoint:
      - /bin/bash
      - /db/init-db.sh
    environment:
      DB_HOST: sqlserver
      DB_PORT: "1433"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - ./db:/db:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xionico-backend
    environment:
      APP_NAME: Xionico Orders API
      APP_VERSION: 1.0.0
      APP_ENV: development
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_NAME: xionico_orders
      DB_USER: xionico_app
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_DRIVER: ODBC Driver 18 for SQL Server
      DB_ENCRYPT: "true"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      DEFAULT_CUSTOMER_CODE: CUST-DEFAULT
      MAX_ORDER_ITEMS: "50"
      MAX_ITEM_QUANTITY: "10000"
    ports:
      - "8000:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  sqlserver_data: